<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    <h1>프런트엔트 개발자 지원서</h1>
    <p>HTML, CSS, 자바스크립트의 기술을 이해하고 실무 경험이 있는 분을 찾습니다.</p>
    <hr>
    <form action="">
        <div class="container">
            <h3>개인 정보</h3>
            <ul>                
                <li>
                    <label for="name">이름</label>
                    <input type="text" id="name" placeholder="공백 없이 입력하세요">
                </li>            
                <li>
                    <label for="number">연락처</label>
                    <input type="tel" id="number">
                </li>
            </ul>
        </div>
        <div class="container">
            <h3>지원분야</h3>
            <ul>
                <li>
                    <label for="wp" type="radio">웹 퍼블리싱</label>
                    <input type="radio" id="wp">
                </li>
                <li>
                    <label for="wad" type="radio">웹 어플리케이션 개발</label>
                    <input type="radio" id="wad">
                </li>
                <li>
                    <label for="dei" type="radio">개발 환경 개선</label>
                    <input type="radio" id="dei">
                </li>
            </ul>           
        </div>
        <div class="container">
            <h3>지원동기</h3>
            <textarea name="reason" id="reason" placeholder="본사 지원 동기를 간략히 써 주세요." min="60"></textarea>            
        </div>
        <button type="submit">접수하기</button>
        <button type="reset">다시 쓰기</button>
    </form>
</body>
</html>
