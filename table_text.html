<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <style>
    table, td, th {
      border:1px solid #ccc;
    }
    td, th {
      padding:10px 20px;
    }
    td:last-child{
      width:200px;
    }
  </style>
</head>
<body>
    <caption>
        <h1>수습 국원 지원 양식</h1>
    </caption>
    <table>
        <tr>
            <td rowspan="3">개인정보</td>
            <td>이름</td>
            <td colspan="2"></td>
        </tr>
        <tr>
            <td>학과/학번</td>
            <td></td>
        </tr>
        <tr>            
            <td>연락처</td>
            <td></td>
        </tr>
        <tr>
            <td>지원분야</td>
            <td colspan="2"></td>            
        </tr>
    </table>
</body>
</html>
